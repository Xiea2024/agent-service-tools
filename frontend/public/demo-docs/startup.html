<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>依赖升级与启动检查 · 演示资料</title><style>body{max-width:760px;margin:60px auto;padding:0 24px;font:16px/1.9 system-ui;color:#244435;background:#f7faf7}a{color:#216b54}aside{padding:16px;background:#e6efe7;border-radius:12px}</style><main><a href="../">← 返回 SupportPilot 演示</a><h1>依赖升级与启动检查</h1><aside>静态演示资料：内容为公开展示样例，未读取任何内部文档。</aside><p>保留首个异常与依赖锁文件，确认解释器和启动目录一致。在独立环境按锁文件安装，检查缺失配置项名称；对比最后正常版本，避免直接覆盖生产依赖或删除运行数据。</p><h2>交接时需要的信息</h2><ul><li>启动命令、系统、语言与依赖版本。</li><li>首个异常及最小复现步骤。</li><li>最后正常版本和本次依赖差异。</li><li>缺失配置项名称，禁止包含密钥值。</li></ul><p>在隔离环境验证候选原因，保留可恢复的回滚方案。</p></main></html>
