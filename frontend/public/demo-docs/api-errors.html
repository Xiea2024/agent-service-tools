<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接口 500 排查手册 · 演示资料</title><style>body{max-width:760px;margin:60px auto;padding:0 24px;font:16px/1.9 system-ui;color:#244435;background:#f7faf7}a{color:#216b54}aside{padding:16px;background:#e6efe7;border-radius:12px}</style><main><a href="../">← 返回 SupportPilot 演示</a><h1>接口 500 排查手册</h1><aside>静态演示资料：本文为虚构的公开样例，不是客户故障记录，也未从真实知识库检索。</aside><h2>先关联同一条请求</h2><p>记录请求方法、路径、时间、request_id、预期与实际状态码；使用脱敏最小请求复现。关联同一 request_id 的网关和应用日志，区分上游超时、业务异常与依赖故障。</p><h2>排查顺序</h2><ol><li>保存首个异常及请求标识。</li><li>对比网关日志与应用异常栈。</li><li>检查数据库、外部 API 等依赖。</li><li>核对近期部署、配置与迁移。</li></ol><p>仅凭 HTTP 500 无法确定根因。不要在演示页输入真实凭据或未脱敏日志。</p></main></html>
