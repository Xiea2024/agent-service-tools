model_list:
  - model_name: demo-chat
    litellm_params:
      model: os.environ/UPSTREAM_CHAT_MODEL
      api_base: os.environ/UPSTREAM_CHAT_BASE
      api_key: os.environ/UPSTREAM_CHAT_KEY
      max_tokens: 2000
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
  - model_name: demo-embedding
    litellm_params:
      model: os.environ/UPSTREAM_EMBEDDING_MODEL
      api_base: os.environ/UPSTREAM_EMBEDDING_BASE
      api_key: os.environ/UPSTREAM_EMBEDDING_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.0
litellm_settings:
  num_retries: 0
  request_timeout: 60
  set_verbose: false
  turn_off_message_logging: true
  max_budget: 5
  budget_duration: 30d
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
router_settings:
  redis_host: redis
  redis_port: 6379
