name: supportpilot-app
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: ${SUPPORTPILOT_IMAGE_PREFIX:-supportpilot}-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    env_file:
      - ${SUPPORTPILOT_ENV_FILE:-../.env.docker}
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      MODE: prod
      TENANT_MODE: "true"
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  web:
    image: ${SUPPORTPILOT_IMAGE_PREFIX:-supportpilot}-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  app_data:
