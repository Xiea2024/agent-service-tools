name: CI and GHCR

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: ./.github/actions/setup-python
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pyrefly check

  pytest:
    name: Pytest with PostgreSQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d supportpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENAI_API_KEY: sk-fake-openai-key
      LANGCHAIN_TRACING_V2: "false"
      LANGFUSE_TRACING: "false"
      TENANT_MODE: "false"
      DATABASE_TYPE: sqlite
      TEST_POSTGRES_DSN: postgresql://ci:ci-only-password@127.0.0.1:5432/supportpilot_test
      SUPPORTPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Run tests without external model credentials
        run: >-
          uv run --no-sync pytest tests -q --strict-markers -m "not docker"
          --junitxml=reports/pytest.xml --cov=src
          --cov-report=xml:reports/coverage.xml --cov-report=term-missing
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  images:
    name: Container / ${{ matrix.component }}
    needs: [lint, pytest, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/Dockerfile.service
          - component: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve image name and publishing policy
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$EVENT_NAME" != pull_request ]] && \
             [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Build and load for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Verify container starts and becomes healthy
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        shell: bash
        run: |
          docker run --detach --name image-smoke \
            --env USE_FAKE_MODEL=true --env DEFAULT_MODEL=fake \
            --env TENANT_MODE=false --env DATABASE_TYPE=sqlite "$IMAGE"
          for _ in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' image-smoke)
            if [[ "$state" == healthy ]]; then exit 0; fi
            if [[ "$state" == unhealthy ]]; then break; fi
            sleep 2
          done
          docker logs image-smoke
          exit 1
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images
        if: steps.image.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
      - name: Clean up smoke container
        if: always()
        run: docker rm --force image-smoke || true
