name: Set up project Python
description: Install the pinned uv version, Python 3.13, and locked test dependencies
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.5"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      shell: bash
      run: uv sync --frozen --group feishu --group rag
